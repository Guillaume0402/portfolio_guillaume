services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    container_name: ${COMPOSE_PROJECT_NAME:-app}_web
    ports:
      - "${WEB_PUBLISHED_HOST:-127.0.0.1}:${WEB_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_TZ: ${APP_TZ:-Europe/Paris}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-app}
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-app_password}
      SMTP_HOST: "${SMTP_HOST:-mailpit}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_ENCRYPTION: "${SMTP_ENCRYPTION:-}"
      MAIL_FROM: "${MAIL_FROM:-no-reply@example.test}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Portfolio Guillaume}"
      CONTACT_TO: "${CONTACT_TO:-developer@example.test}"

      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-1x00000000000000000000AA}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}"
      TURNSTILE_ALLOWED_HOSTNAMES: "${TURNSTILE_ALLOWED_HOSTNAMES:-localhost,127.0.0.1}"
      TURNSTILE_EXPECTED_ACTION: "${TURNSTILE_EXPECTED_ACTION:-contact}"

      CONTACT_RATE_LIMIT_MAX_ATTEMPTS: "${CONTACT_RATE_LIMIT_MAX_ATTEMPTS:-5}"
      CONTACT_RATE_LIMIT_WINDOW_SECONDS: "${CONTACT_RATE_LIMIT_WINDOW_SECONDS:-900}"
      CONTACT_RATE_LIMIT_BLOCK_SECONDS: "${CONTACT_RATE_LIMIT_BLOCK_SECONDS:-3600}"
      CONTACT_IP_HASH_KEY: "${CONTACT_IP_HASH_KEY:-local-only-rate-limit-pepper-please-change}"
      CONTACT_TRUSTED_PROXIES: "${CONTACT_TRUSTED_PROXIES:-}"
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net

  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-app}_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-app}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_password}
    ports:
      - "${DB_PUBLISHED_HOST:-127.0.0.1}:${DB_PUBLISHED_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ${COMPOSE_PROJECT_NAME:-app}_pma
    ports:
      - "${PMA_PUBLISHED_HOST:-127.0.0.1}:${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: ${DB_HOST:-db}
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net

  mailpit:
    image: axllent/mailpit
    container_name: ${COMPOSE_PROJECT_NAME:-app}_mailpit
    ports:
      - "${MAILPIT_PUBLISHED_HOST:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PUBLISHED_HOST:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net

volumes:
  mysql_data:

networks:
  app_net:
    driver: bridge
